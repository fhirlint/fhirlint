# Hook definitions for the pre-commit framework (https://pre-commit.com).
#
#   repos:
#     - repo: https://github.com/fhirlint/fhirlint
#       rev: v1.5.0
#       hooks:
#         - id: fhirlint
#           files: ^input/resources/.*\.json$
#
# Both hooks pass --skip-non-fhir, so unrelated files (package.json,
# tsconfig.json, ...) are skipped rather than reported as FATAL. Narrowing
# `files:` to the directory holding your resources is still worthwhile — it
# keeps the hook from opening every JSON file in the repo on each commit — but
# it is no longer required to get a usable result.
#
# A malformed resource is still validated and still fails, so the hook cannot
# silently pass a broken file.

- id: fhirlint
  name: fhirlint
  description: Validate FHIR resources with the HL7 FHIR Validator
  entry: fhirlint validate
  language: golang
  files: \.(json|xml|ndjson)$
  args: [--quiet, --skip-non-fhir]

# Same hook, but runs the prebuilt image instead of building from source — no Go
# toolchain needed and the validator JAR is baked in. Note the image tag floats:
# pinning `rev:` pins this hook definition, not the image contents.
- id: fhirlint-docker
  name: fhirlint (docker)
  description: Validate FHIR resources with the HL7 FHIR Validator (prebuilt image)
  entry: ghcr.io/fhirlint/fhirlint:latest validate
  language: docker_image
  files: \.(json|xml|ndjson)$
  args: [--quiet, --skip-non-fhir]
