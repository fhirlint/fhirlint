name: 'fhirlint'
description: 'Validate FHIR resources against profiles and implementation guides'
author: 'fhirlint'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  path:
    description: 'File or directory of FHIR resources to validate'
    required: false
    default: ''
  url:
    description: 'Validate a FHIR resource fetched from an HTTP URL instead of a path'
    required: false
    default: ''
  profile:
    description: 'Profile alias or URL (one per line, or comma-separated, for multiple)'
    required: false
    default: ''
  ig:
    description: 'Implementation guide package(s), e.g. kbv.basis#1.5.0 (one per line)'
    required: false
    default: ''
  severity:
    description: 'Minimum severity to display: information | warning | error'
    required: false
    default: 'information'
  fail-on:
    description: 'Exit non-zero at this severity or above: error | warning | information | never'
    required: false
    default: 'error'
  format:
    description: 'Output format: terminal | json | html | junit | sarif | markdown | codeclimate'
    required: false
    default: 'terminal'
  output:
    description: 'Write the report to this file (stdout if omitted)'
    required: false
    default: ''
  since:
    description: 'Validate only files changed against this git ref, e.g. origin/${{ github.base_ref }}. Needs fetch-depth: 0 on actions/checkout'
    required: false
    default: ''
  tx-offline:
    description: 'Replay terminology recorded by "fhirlint tx warm" instead of contacting a terminology server'
    required: false
    default: 'false'
  tx-dir:
    description: 'Directory holding the terminology recording (default: .fhirlint-tx/)'
    required: false
    default: ''
  version:
    description: "fhirlint version to install — a release tag (e.g. v1.3.0) or 'latest'"
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Install fhirlint
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FHIRLINT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ "$FHIRLINT_VERSION" = "latest" ]; then
          gh release download --repo fhirlint/fhirlint --pattern '*linux_amd64.tar.gz'
        else
          gh release download "$FHIRLINT_VERSION" --repo fhirlint/fhirlint --pattern '*linux_amd64.tar.gz'
        fi
        tar xzf fhirlint_*_linux_amd64.tar.gz
        sudo mv fhirlint /usr/local/bin/
        rm -f fhirlint_*_linux_amd64.tar.gz
        fhirlint version

    - name: Run fhirlint
      shell: bash
      env:
        IN_PATH: ${{ inputs.path }}
        IN_URL: ${{ inputs.url }}
        IN_PROFILE: ${{ inputs.profile }}
        IN_IG: ${{ inputs.ig }}
        IN_SEVERITY: ${{ inputs.severity }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_FORMAT: ${{ inputs.format }}
        IN_OUTPUT: ${{ inputs.output }}
        IN_SINCE: ${{ inputs.since }}
        IN_TX_OFFLINE: ${{ inputs.tx-offline }}
        IN_TX_DIR: ${{ inputs.tx-dir }}
      run: |
        set -euo pipefail
        # A shallow checkout has no merge base, so --since would fail with git's
        # own message and no clue about the cause. actions/checkout clones with
        # fetch-depth: 1 by default, so this is the common case, not the edge one.
        if [ -n "$IN_SINCE" ] && [ "$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
          echo "::error::'since' needs the full history, but this checkout is shallow." \
               "Add 'fetch-depth: 0' to your actions/checkout step."
          exit 1
        fi
        args=(validate)
        if [ -n "$IN_PATH" ]; then args+=("$IN_PATH"); fi
        if [ -n "$IN_URL" ]; then args+=(--url "$IN_URL"); fi
        # profile/ig accept multiple values, one per line or comma-separated
        if [ -n "$IN_PROFILE" ]; then
          while IFS= read -r p; do
            if [ -n "$p" ]; then args+=(--profile "$p"); fi
          done <<< "${IN_PROFILE//,/$'\n'}"
        fi
        if [ -n "$IN_IG" ]; then
          while IFS= read -r g; do
            if [ -n "$g" ]; then args+=(--ig "$g"); fi
          done <<< "${IN_IG//,/$'\n'}"
        fi
        if [ -n "$IN_SEVERITY" ]; then args+=(--severity "$IN_SEVERITY"); fi
        if [ -n "$IN_FAIL_ON" ]; then args+=(--fail-on "$IN_FAIL_ON"); fi
        if [ -n "$IN_FORMAT" ]; then args+=(--format "$IN_FORMAT"); fi
        if [ -n "$IN_OUTPUT" ]; then args+=(--output "$IN_OUTPUT"); fi
        if [ -n "$IN_SINCE" ]; then args+=(--since "$IN_SINCE"); fi
        if [ -n "$IN_TX_DIR" ]; then args+=(--tx-dir "$IN_TX_DIR"); fi
        case "${IN_TX_OFFLINE,,}" in
          true|yes|1) args+=(--tx-offline) ;;
          ''|false|no|0) ;;
          *) echo "::error::'tx-offline' must be true or false, got '$IN_TX_OFFLINE'"; exit 1 ;;
        esac
        echo "+ fhirlint ${args[*]}"
        fhirlint "${args[@]}"
