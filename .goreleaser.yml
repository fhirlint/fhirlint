version: 2

project_name: fhirlint

builds:
  - main: .
    binary: fhirlint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    # Reproducible builds (#549): no build paths, no build ID, and the commit
    # time instead of the build time, so rebuilding a tag gives the same
    # checksums. .github/workflows/reproducible-build.yml checks it.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w -buildid= -X github.com/fhirlint/fhirlint/cmd.version={{ .Tag }}

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Fixed owner and the commit time for every archive entry, instead of the
    # runner's user and the checkout time (#549). The files are the ones
    # GoReleaser added by default before.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

homebrew_casks:
  - name: fhirlint
    repository:
      owner: fhirlint
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/fhirlint/fhirlint"
    description: "Lightweight CLI for validating FHIR resources against profiles and implementation guides"
    # fhirlint shells out to the HL7 FHIR Validator JAR, which needs a JRE.
    dependencies:
      - formula: openjdk@17
    # Remove the macOS quarantine attribute so the unsigned binary runs without
    # a Gatekeeper prompt.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/fhirlint"]
          end

# One SBOM per released archive, generated with syft. The workflow installs syft
# before running GoReleaser; without it on PATH the release fails here rather
# than shipping archives with no SBOM.
sboms:
  - artifacts: archive

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    # Conventional Commits allow an optional scope, and this repo uses one
    # constantly to reference issues: "ci(#310): …" as much as "ci: …". A plain
    # "^ci:" matches only the unscoped half, which is why v1.8.0 shipped with a
    # ci() commit in its notes. The optional group covers both spellings.
    #
    # Single-quoted so the backslashes reach the regex engine as written.
    exclude:
      - '^docs(\([^)]*\))?:'
      - '^test(\([^)]*\))?:'
      - '^ci(\([^)]*\))?:'
      # Housekeeping — version-reference bumps, removing files that were never
      # shipped. Release notes are read by people deciding whether to upgrade,
      # and none of it changes that decision.
      - '^chore(\([^)]*\))?:'
      - "Merge pull request"
      - "Merge branch"
