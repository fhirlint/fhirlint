name: GitHub Actions Security Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        id: zizmor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The action uploads its results to the security tab but cannot fail the
      # job: with advanced-security it runs `zizmor --format=sarif`, which exits
      # 0 even with findings (the same audit exits 13 in human format). Every
      # analysis on main was uploading 2 findings while this job stayed green
      # (#263), so the findings are re-read here and failed on. No second zizmor
      # run — this is the SARIF the action already produced.
      - name: Fail on zizmor findings
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          set -euo pipefail
          if [ -z "${SARIF}" ] || [ ! -f "${SARIF}" ]; then
            echo "::error::zizmor produced no SARIF file — cannot tell whether the audit ran"
            exit 1
          fi
          count=$(jq '[.runs[].results[]] | length' "${SARIF}")
          if [ "${count}" -gt 0 ]; then
            jq -r '.runs[].results[]
              | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' \
              "${SARIF}"
            echo "zizmor reported ${count} finding(s)"
            exit 1
          fi
          echo "zizmor reported no findings"
