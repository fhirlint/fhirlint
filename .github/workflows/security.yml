name: Security

on:
  # main only on push — PRs are covered by pull_request, so branch pushes
  # would otherwise run every check twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC

# Every job grants its own permissions; nothing is granted by default.
permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 34s in 12 runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache integrity
        run: go mod verify

      # Pinned, not @latest: a security job that can change under us overnight
      # is the wrong shape, which is what #414 ran into when x/vuln v1.8.0
      # raised its own go directive past the module's. go.mod now asks for
      # 1.26.10, so v1.9.0 builds. Raise this pin together with go.mod.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # CLAUDE.md, the Claude Code plugin (.claude-plugin/, hooks/, skills/) and
  # any agent settings a pull request adds are loaded as trusted instructions
  # or run automatically. The plugin is installed from main, so a change to it
  # reaches users without a release (#501).
  cfgaudit:
    name: cfgaudit
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 13s in 12 runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The config lives outside the workspace, so a .cfgaudit.yml in the pull
      # request cannot turn rules off; the action mounts it read-only.
      # content-paths also scans the Markdown docs for hidden content.
      - name: Write the scan config
        run: |
          cat > "$RUNNER_TEMP/cfgaudit.yml" <<'YAML'
          content-paths:
            - "*.md"
            - "docs/**/*.md"
            - ".github/**/*.md"
            - "skills/**/*.md"
          YAML

      - name: Scan agent instructions, settings, the plugin and docs
        uses: cfgaudit/cfgaudit@ad25f5a095a27dd08e8746347963d233e55686f7 # v1.20.0
        with:
          plugins: .
          config: ${{ runner.temp }}/cfgaudit.yml
          strict: "true"

  # The GitLab mirror publishes the CI/CD Catalog version from .gitlab-ci.yml,
  # and templates/ is the component users include. Nothing on GitLab lints
  # either, so it happens here (#504); --strict fails on warnings too.
  # --no-repo-config: a .glsec.yml in the pull request must not decide how it
  # is checked.
  glsec:
    name: glsec
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 24s in 12 runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Pinned; the Go checksum database verifies the module.
      - name: Lint the GitLab pipeline and the component
        run: |
          go install github.com/glsec/glsec/cmd/glsec@v1.23.0
          glsec --no-repo-config --strict .gitlab-ci.yml
          glsec --no-repo-config --strict templates/fhirlint.yml

  # govulncheck reports only what fhirlint's code can reach in Go modules.
  # OSV-Scanner also reports unreachable ones, the Python tools CI installs
  # (.github/requirements), and the OpenSSF malicious-packages feed (#550).
  osv-scanner:
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 21s in 3 runs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            --lockfile=requirements.txt:./.github/requirements/check-jsonschema.txt
            ./

  # Blocks a pull request that adds a dependency with a known vulnerability or
  # a license outside the list, before it reaches main; Dependabot only reacts
  # afterwards (#550).
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 12s in 2 runs
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, PSF-2.0, Unlicense, 0BSD
          # typing-extensions is PSF-2.0 (its LICENSE file), but GitHub's
          # detection reports a mix that includes GPL-1.0-or-later from the
          # history section of the Python license text. It comes in through
          # check-jsonschema, which only runs in CI; nothing ships with fhirlint.
          allow-dependencies-licenses: pkg:pypi/typing-extensions

  # zizmor and cfgaudit check that every action is pinned to a SHA; pinact also
  # checks that the version comment next to it is true, so a pin can't claim a
  # version it isn't and mislead reviewers and Dependabot (#550). Not limited
  # to pull requests that touch workflows, so it can be a required check.
  # pinact v5.0.2 needs Go 1.27.3 or later, newer than go.mod; setup-go sets
  # GOTOOLCHAIN=local, so the job asks for that Go itself.
  pinact:
    name: pinact
    runs-on: ubuntu-latest
    timeout-minutes: 10 # max 39s in 1 run; builds pinact with Go 1.27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false

      - run: go install github.com/suzuki-shunsuke/pinact/v5/cmd/pinact@v5.0.2

      - name: Verify action pins and their version comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # aquasecurity/* is excluded here, not in a config a pull request could
        # edit: the org has a GitHub IP allow list, so a runner can't read its
        # tags through the API (403), whatever the token. trivy-action stays
        # SHA-pinned, and zizmor and cfgaudit still enforce that.
        run: pinact run --check --verify-comment --exclude 'aquasecurity/.*'
