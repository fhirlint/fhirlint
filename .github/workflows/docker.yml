name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Granted per job below: the gate only needs to read workflow runs, and must not
# inherit the publishing job's registry and signing scopes.
permissions: {}

jobs:
  # Applies to workflow_dispatch too: a manual run republishes and re-signs
  # `latest`, so it gets the same gate rather than being an unchecked bypass.
  require-green-ci:
    uses: ./.github/workflows/require-green-ci.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  build-and-push:
    name: Build and push Docker image
    needs: require-green-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # keyless signing via Sigstore (cosign, attestations)
      attestations: write # write attestations to the GitHub attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/fhirlint/fhirlint
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # VERSION also reaches the builder stage, so the binary inside the
          # image reports the release version rather than "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below is keyed on the immutable digest, not a tag: tags move,
      # and an attestation that points at a moving target proves nothing.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/fhirlint/fhirlint
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/fhirlint/fhirlint@${DIGEST}"

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/fhirlint/fhirlint@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # Defaults to true, which makes the action attach the SBOM to the
          # GitHub Release on a tag push — that needs contents: write, which
          # this job deliberately does not have (#266). The image SBOM exists to
          # be attested below; the archive SBOMs are attached to the release by
          # GoReleaser already.
          upload-release-assets: false

      - name: Attest image SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/fhirlint/fhirlint
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
