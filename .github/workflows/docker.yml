name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Granted per job below: the gate only needs to read workflow runs, and must not
# inherit the publishing job's registry and signing scopes.
permissions: {}

jobs:
  # Applies to workflow_dispatch too: a manual run republishes and re-signs
  # `latest`, so it gets the same gate rather than being an unchecked bypass.
  require-green-ci:
    uses: $/.github/workflows/require-green-ci.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  # The build runs in a reusable workflow so that it, not this file, signs
  # the provenance and the image: SLSA Build Level 3 (#601).
  build-and-push:
    needs: require-green-ci
    uses: $/.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
