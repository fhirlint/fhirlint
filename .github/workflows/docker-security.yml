name: Docker Security

on:
  # Only main on push — PRs are covered by pull_request, so branch pushes would
  # otherwise run every gate twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC — base-image CVEs appear without a code change

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  image:
    name: Image scan (Trivy + dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Built once and loaded into the local daemon so both scanners reuse it.
      # The layer cache matters here: the Dockerfile downloads the ~250 MB
      # validator JAR, which is wasteful to refetch on every run.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: fhirlint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fhirlint:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Lint image (dockle)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 1 --exit-level warn \
            fhirlint:ci

      # Guards the non-root setup: a wrong HOME or wrong ownership on the baked
      # JAR would still pass dockle but break every real run of the image.
      - name: Smoke-test the image as non-root
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id fhirlint:ci -u)" = "65532"
          docker run --rm -v "$PWD/testdata:/work:ro" fhirlint:ci \
            validate /work/patient.json
          # Arbitrary uid with gid 0 must keep working (OpenShift-style runtimes).
          docker run --rm --user 1234:0 -v "$PWD/testdata:/work:ro" fhirlint:ci \
            validate /work/patient.json

      # This job builds without --build-arg, so VERSION is the "dev" default and
      # only the static labels are asserted. The release workflow supplies the
      # real values.
      - name: Check OCI image labels
        run: |
          set -euo pipefail
          labels=$(docker inspect fhirlint:ci --format '{{json .Config.Labels}}')
          echo "$labels"
          for key in title description source url documentation licenses vendor created version revision; do
            echo "$labels" | jq -e --arg k "org.opencontainers.image.$key" \
              '.[$k] // empty | select(length > 0)' >/dev/null \
              || { echo "missing or empty label: org.opencontainers.image.$key"; exit 1; }
          done
