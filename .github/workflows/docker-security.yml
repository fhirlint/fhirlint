name: Docker Security

on:
  # Only main on push — PRs are covered by pull_request, so branch pushes would
  # otherwise run every gate twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC — base-image CVEs appear without a code change

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint - < Dockerfile

  image:
    name: Image scan (Trivy + dockle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Built once and loaded into the local daemon so both scanners reuse it.
      # The layer cache matters here: the Dockerfile downloads the ~250 MB
      # validator JAR, which is wasteful to refetch on every run.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: fhirlint:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage runs `apk --no-cache upgrade`. Cached, that layer
          # replays an upgrade from whenever it first ran and never picks up a
          # base-image fix published since — which is how openssl 3.5.7-r0
          # survived in the image after 3.5.8-r0 was already in Alpine (#371).
          # The jar-downloader stage stays cached, so the ~250 MB validator JAR
          # is still not refetched.
          no-cache-filters: runtime

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fhirlint:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Lint image (dockle)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 1 --exit-level warn \
            fhirlint:ci

      # Guards the non-root setup: a wrong HOME or wrong ownership on the baked
      # JAR would still pass dockle but break every real run of the image.
      - name: Smoke-test the image as non-root
        run: |
          set -euo pipefail
          test "$(docker run --rm --entrypoint id fhirlint:ci -u)" = "65532"
          docker run --rm -v "$PWD/testdata:/work:ro" fhirlint:ci \
            validate /work/patient.json
          # Arbitrary uid with gid 0 must keep working (OpenShift-style runtimes).
          docker run --rm --user 1234:0 -v "$PWD/testdata:/work:ro" fhirlint:ci \
            validate /work/patient.json
          # The baked validator version must be a version, not the raw redirect
          # header the build used to write (#222). Capture the output first:
          # piping a live container into `grep -q` lets grep exit on match and
          # SIGPIPE the still-writing process, which under pipefail fails the
          # step at random (#234).
          version_out=$(docker run --rm fhirlint:ci version)
          printf '%s\n' "$version_out" | grep -qE '^validator: +[0-9]+\.[0-9]+'

      # This job builds without --build-arg, so VERSION is the "dev" default and
      # only the static labels are asserted. The release workflow supplies the
      # real values.
      - name: Check OCI image labels
        run: |
          set -euo pipefail
          labels=$(docker inspect fhirlint:ci --format '{{json .Config.Labels}}')
          echo "$labels"
          for key in title description source url documentation licenses vendor created version revision; do
            echo "$labels" | jq -e --arg k "org.opencontainers.image.$key" \
              '.[$k] // empty | select(length > 0)' >/dev/null \
              || { echo "missing or empty label: org.opencontainers.image.$key"; exit 1; }
          done
