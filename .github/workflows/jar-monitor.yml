name: JAR Security Monitor

on:
  schedule:
    - cron: '0 7 * * 1'   # Weekly, Monday 07:00 UTC
  workflow_dispatch:

jobs:
  check-advisories:
    name: Check hapifhir advisories
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Query GitHub Security Advisories
        id: advisories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(gh api repos/hapifhir/org.hl7.fhir.core/security-advisories --jq 'length' 2>/dev/null || echo "0")
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Open issue if advisories found
        if: steps.advisories.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          count="${{ steps.advisories.outputs.count }}"
          existing=$(gh issue list --label "security,jar" --state open --json number --jq 'length')
          if [ "$existing" -gt "0" ]; then
            echo "Issue already open, skipping."
            exit 0
          fi
          printf 'The GitHub Security Advisory database lists **%s** advisory/advisories for [hapifhir/org.hl7.fhir.core](https://github.com/hapifhir/org.hl7.fhir.core/security/advisories).\n\n**Action required:**\n1. Review the advisories at the link above.\n2. Check whether the current latest JAR release includes a fix.\n3. Update the README / SECURITY.md if the minimum safe version changes.\n4. Close this issue once resolved.\n\nUsers can check their installation with: `fhirlint audit`\nUsers can update with: `fhirlint update`\n' \
            "$count" > /tmp/issue-body.txt
          gh issue create \
            --title "Security: $count advisory/advisories found for hapifhir/org.hl7.fhir.core" \
            --label "security" \
            --body-file /tmp/issue-body.txt
