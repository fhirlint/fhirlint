name: JAR Security Monitor

on:
  schedule:
    - cron: '0 7 * * 1'   # Weekly, Monday 07:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check-advisories:
    name: Check advisories affecting the latest JAR
    runs-on: ubuntu-latest
    steps:
      # Audit against the *latest* validator JAR using fhirlint itself, so we
      # only alert when a published advisory actually affects the version users
      # would run — not merely because historical advisories exist.
      - name: Audit latest JAR
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh ghcr.io/fhirlint/fhirlint:latest -c \
            'fhirlint update >/dev/null 2>&1 || true; fhirlint audit --format json' > audit.json
          cat audit.json

      - name: File or resolve advisory issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          affecting=$(jq '.affecting | length' audit.json)
          latest=$(jq -r '.latestVersion // "unknown"' audit.json)
          existing=$(gh issue list --label security --label jar --state open --json number --jq '.[0].number // ""')

          if [ "$affecting" -eq 0 ]; then
            echo "No advisory affects the latest JAR ($latest)."
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Resolved automatically: no published advisory affects the latest validator JAR (\`$latest\`). Closing."
              gh issue close "$existing"
            fi
            exit 0
          fi

          echo "$affecting advisory/advisories affect the latest JAR ($latest)."
          body=$(jq -r --arg latest "$latest" '
            "The latest HL7 FHIR Validator JAR (`\($latest)`) is affected by \(.affecting | length) published security advisory/advisories:\n\n"
            + ([.affecting[] | "- **\(.severity)** [\(.ghsaId)](\(.url)) — \(.summary)"] | join("\n"))
            + "\n\n**Action:** run `fhirlint update` then `fhirlint audit` to confirm; see SECURITY.md. Close this issue once upstream ships a fixed release and the audit is clean."
          ' audit.json)

          if [ -n "$existing" ]; then
            printf '%s\n' "$body" | gh issue comment "$existing" --body-file -
          else
            printf '%s\n' "$body" | gh issue create \
              --title "Security: latest validator JAR ($latest) affected by advisories" \
              --label security --label jar \
              --body-file -
          fi
