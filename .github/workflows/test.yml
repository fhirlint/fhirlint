name: Tests

on:
  # main only on push — PRs are covered by pull_request, so branch pushes
  # would otherwise run every check twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

# Every job grants its own permissions; nothing is granted by default.
permissions: {}

jobs:
  test:
    # GoReleaser ships darwin and windows binaries, so the suite runs on every
    # platform we release for. The path handling in the exclude matcher
    # (cmd/validate.go) normalises separators deliberately; this is what
    # actually verifies it.
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20 # max 116s (macOS) in 12 runs
    permissions:
      contents: read
    strategy:
      # One platform failing should not hide the result on the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Git Bash on the Windows runner, so the pipe in the coverage step
        # below behaves the same everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache integrity
        run: go mod verify

      # go mod verify checks the downloaded modules, not that go.mod and go.sum
      # match the code: a pull request could add or drop a dependency without
      # updating them properly (#503). Linux only, because a Windows checkout
      # may carry CRLF, which tidy would report as a difference.
      - name: Check go.mod and go.sum are tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      - name: Run unit tests
        run: go test -short -race -count=1 -coverprofile=coverage.out ./...

      # The scaling tests skip under -race, which distorts timings; run them
      # once without it (#552).
      - name: Linear scaling
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -run 'TestPipelineScalesLinearly|TestParsersScaleLinearly' -v ./internal/scaling ./internal/validator

      - name: Show coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Fail when the total or a guarded package drops below its floor (#545).
      # Linux only: Windows skips a few tests and sits about 0.1 points lower.
      # Raise a floor on purpose; never lower one to make a change pass. The
      # total stays at 80 or above: the OpenSSF Best Practices silver level asks
      # for 80 percent statement coverage (#595).
      #
      # Excluded, with the reason, and nowhere else:
      #   main.go           one line that calls cmd.Execute
      #   internal/tools/   CI helper commands, run by the workflows that use them
      # internal/jarsettings stays in: the integration suite covers it, and the
      # number should show that the unit tests don't. The JAR paths of
      # internal/validator and cmd run against internal/tools/fakejava (#595).
      - name: Coverage floor
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_FLOOR: "85.0"
          # package=floor, space-separated: the public API and the core.
          PACKAGE_FLOORS: "pkg/fhirlint=90.9 internal/validator=84.3"
          EXCLUDE: '^github[.]com/fhirlint/fhirlint/(main[.]go|internal/tools/)'
        run: |
          awk -v ex="$EXCLUDE" '
            NR > 1 && $1 !~ ex {
              split($1, loc, ":"); pkg = loc[1]
              sub(/\/[^\/]*$/, "", pkg); sub(/^github\.com\/fhirlint\/fhirlint\/?/, "", pkg)
              if (pkg == "") pkg = "."
              stmts[$1] = $2; pkgof[$1] = pkg
              if ($3 > 0) hit[$1] = 1
            }
            END {
              for (k in stmts) {
                p = pkgof[k]; total[p] += stmts[k]; all += stmts[k]
                if (k in hit) { covered[p] += stmts[k]; allcov += stmts[k] }
              }
              for (p in total) printf "%s\t%.1f\n", p, 100 * covered[p] / total[p]
              printf "TOTAL\t%.1f\n", 100 * allcov / all
            }' coverage.out | sort > coverage.tsv

          total=$(awk -F'\t' '$1 == "TOTAL" { print $2 }' coverage.tsv)
          {
            echo "### Test coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
            echo
            echo "| Package | Coverage |"
            echo "|---|---|"
            awk -F'\t' '$1 != "TOTAL" { printf "| `%s` | %s%% |\n", $1, $2 }' coverage.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          below() { awk -v v="$1" -v f="$2" 'BEGIN { exit !(v + 0 < f + 0) }'; }
          if below "$total" "$COVERAGE_FLOOR"; then
            echo "::error::test coverage ${total}% is below the floor of ${COVERAGE_FLOOR}%"
            fail=1
          fi
          for pf in $PACKAGE_FLOORS; do
            pkg=${pf%=*} floor=${pf#*=}
            got=$(awk -F'\t' -v p="$pkg" '$1 == p { print $2 }' coverage.tsv)
            if [ -z "$got" ] || below "$got" "$floor"; then
              echo "::error::$pkg coverage ${got:-missing}% is below its floor of ${floor}%"
              fail=1
            fi
          done
          echo "test coverage ${total}% (floor ${COVERAGE_FLOOR}%)"
          exit "$fail"

      # The lines a pull request adds or changes in non-test Go files must be
      # covered too, so new code can't hide behind the total (#545). HEAD is
      # the merge commit; its first parent is the target branch.
      - name: Patch coverage
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: |
          git fetch --depth=2 origin "$GITHUB_SHA"
          git diff --unified=0 HEAD^1 HEAD -- '*.go' ':!*_test.go' ':!main.go' ':!internal/tools/**' > "$RUNNER_TEMP/change.diff"
          # 60%, and up to 5 uncovered lines always pass: code on the JAR path
          # is reached only by the integration suite, which this can't see.
          go run ./internal/tools/patchcoverage -min 60 -grace 5 -diff "$RUNNER_TEMP/change.diff" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      # For the Codecov upload below. Linux only: a shared artifact name
      # collides across matrix legs, and Linux is where the floors are checked.
      - if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # Publishes the coverage of main at app.codecov.io/gh/fhirlint/fhirlint,
  # behind the README badge. The floors in the test job stay the gate: this
  # job never runs on pull requests and never fails the build.
  coverage-upload:
    name: Upload coverage to Codecov
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # new; one upload, about 30s in glsec
    permissions:
      contents: read
      id-token: write # OIDC upload, no stored Codecov token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

  # go test -cover counts statements only; gobco counts each branch, so an
  # untested else or early return shows up here (#617). Same rule as the
  # statement floor: raise BRANCH_FLOOR on purpose, never lower it.
  #
  # Left out, with the reason:
  #   internal/tools/        CI helper commands, as for the statement floor
  #   internal/resultcache   its owner_unix.go and owner_other.go both define
  #                          ownedByCurrentUser for different platforms, and
  #                          gobco type-checks every file regardless of build
  #                          tags (rillig/gobco, "Honor build constraints")
  branch-coverage:
    name: Branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15 # new; about 4m locally for all packages
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go install github.com/rillig/gobco@v1.3.4

      - name: Branch coverage
        env:
          BRANCH_FLOOR: "75.7"
          EXCLUDE: '/internal/tools/|/internal/resultcache$'
        run: |
          for dir in $(go list -f '{{.Dir}}' ./... | grep -Ev "$EXCLUDE"); do
            pkg=${dir#"$PWD"}; pkg=${pkg#/}; [ -n "$pkg" ] || pkg=.
            # Without -verbose gobco shows no test output, so a failure would
            # only say "exit status 1"; rerun the package to show which test.
            out=$(gobco -branch -test -short "./$pkg") || {
              echo "$out"
              gobco -branch -test -short -verbose "./$pkg" 2>&1 | grep -E -- '--- FAIL|_test\.go:[0-9]+:|^panic' || true
              exit 1
            }
            echo "$out" | sed -n "s|^Branch coverage: \([0-9]*\)/\([0-9]*\)$|$pkg\t\1\t\2|p"
          done > branches.tsv

          read -r covered total < <(awk -F'\t' '{ c += $2; t += $3 } END { print c, t }' branches.tsv)
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", 100 * c / t }')
          {
            echo "### Branch coverage: ${pct}% (${covered}/${total}, floor ${BRANCH_FLOOR}%)"
            echo
            echo "| Package | Branches covered |"
            echo "|---|---|"
            awk -F'\t' '$3 > 0 { printf "| `%s` | %d/%d (%.1f%%) |\n", $1, $2, $3, 100 * $2 / $3 }' branches.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if ! awk -v p="$pct" -v f="$BRANCH_FLOOR" 'BEGIN { exit !(p + 0 >= f + 0) }'; then
            echo "::error::branch coverage ${pct}% is below the floor of ${BRANCH_FLOOR}%"
            exit 1
          fi
          echo "branch coverage ${pct}% (floor ${BRANCH_FLOOR}%)"

  # Branch protection on main requires the check context "Unit tests" verbatim,
  # and a matrix appends the OS to the job name, so the required context would
  # never appear again and every PR would block. This job carries that name and
  # collects the matrix, which also keeps the protection settings valid if the
  # matrix dimensions ever change.
  test-result:
    name: Unit tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5 # max 5s in 12 runs
    permissions:
      contents: read
    steps:
      - name: Check the matrix succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Matrix result: $RESULT"
          [ "$RESULT" = "success" ]
