name: Lint

on:
  # main only on push — PRs are covered by pull_request, so branch pushes
  # would otherwise run every check twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache integrity
        run: go mod verify

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  config-schema:
    name: fhirlint.yml JSON Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go tests check that the schema covers the right keys; this checks
      # the schema is valid JSON Schema and that the shipped example actually
      # validates against it, which needs a real validator.
      - run: pip install check-jsonschema
      - name: Validate the example config against the schema
        run: check-jsonschema --force-filetype yaml --schemafile fhirlint.schema.json fhirlint.yml.example
