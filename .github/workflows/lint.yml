name: Lint

on:
  # main only on push — PRs are covered by pull_request, so branch pushes
  # would otherwise run every check twice.
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module cache integrity
        run: go mod verify

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  config-schema:
    name: fhirlint.yml JSON Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go tests check that the schema covers the right keys; this checks
      # the schema is valid JSON Schema and that the shipped example actually
      # validates against it, which needs a real validator.
      # Version and hashes pinned in .github/requirements/check-jsonschema.txt,
      # where OSV-Scanner and Dependabot see them (#550).
      - run: pip install --require-hashes --no-deps -r .github/requirements/check-jsonschema.txt
      - name: Validate the example config against the schema
        run: check-jsonschema --force-filetype yaml --schemafile fhirlint.schema.json fhirlint.yml.example

  # The golden reports in internal/reporter/testdata/golden are what the
  # reporters write (TestGoldenReports keeps them current); this checks them
  # against each consumer's schema, so a report GitHub code scanning or GitLab
  # would reject fails here first (#542). The third-party schemas are fetched
  # and pinned by SHA-256; a changed upstream file fails the check until the
  # pin is reviewed and moved.
  report-schemas:
    name: Report schemas
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SARIF_SCHEMA_URL: https://docs.oasis-open.org/sarif/sarif/v2.1.0/errata01/os/schemas/sarif-schema-2.1.0.json
      SARIF_SCHEMA_SHA256: c3b4bb2d6093897483348925aaa73af03b3e3f4bd4ca38cef26dcb4212a2682e
      # Jenkins' junit-10.xsd, the schema Ant, Jenkins and GitLab readers follow.
      JUNIT_XSD_URL: https://raw.githubusercontent.com/jenkinsci/xunit-plugin/0afa700702a6617f483cfd9407711976dc0bd74a/src/main/resources/org/jenkinsci/plugins/xunit/types/model/xsd/junit-10.xsd
      JUNIT_XSD_SHA256: a1a816f58d1bf95ebabf371994df0b9246dee66ea9572fbec4f9296f1b2c0ff6
      GOLDEN: internal/reporter/testdata/golden
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the validators
        run: |
          pip install --require-hashes --no-deps -r .github/requirements/check-jsonschema.txt
          sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: Fetch the pinned schemas
        run: |
          mkdir -p "$RUNNER_TEMP/schemas"
          cd "$RUNNER_TEMP/schemas"
          curl -fsSL -o sarif.json "$SARIF_SCHEMA_URL"
          curl -fsSL -o junit.xsd "$JUNIT_XSD_URL"
          printf '%s  %s\n' "$SARIF_SCHEMA_SHA256" sarif.json "$JUNIT_XSD_SHA256" junit.xsd | sha256sum -c -

      - name: SARIF 2.1.0
        run: check-jsonschema --schemafile "$RUNNER_TEMP/schemas/sarif.json" "$GOLDEN/report.sarif"

      - name: GitLab Code Quality
        run: check-jsonschema --schemafile internal/reporter/testdata/schemas/codeclimate.schema.json "$GOLDEN/report.codeclimate.json"

      - name: JUnit XML
        run: xmllint --noout --schema "$RUNNER_TEMP/schemas/junit.xsd" "$GOLDEN/report.junit.xml"

      - name: fhirlint JSON report
        run: |
          check-jsonschema --check-metaschema fhirlint-report.schema.json internal/reporter/testdata/schemas/codeclimate.schema.json
          check-jsonschema --schemafile fhirlint-report.schema.json "$GOLDEN/report.json"

  # Syntax, expressions and the shell in every workflow's run: blocks
  # (actionlint runs ShellCheck on them), and ShellCheck on the scripts users
  # and CI run: the plugin hook, .github/scripts, and the shell inside the
  # composite Action and the GitLab templates (#546). Every workflow is covered,
  # the scheduled and release ones too. Both tools pinned; a disabled
  # diagnostic needs a narrow scope and a reason.
  workflows-shell:
    name: actionlint and ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      ACTIONLINT_VERSION: v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ShellCheck
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION" >> "$GITHUB_PATH"

      - name: Install actionlint
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

      - name: Workflows
        run: actionlint

      - name: Shell scripts
        if: ${{ !cancelled() }}
        run: shellcheck hooks/*.sh .github/scripts/*.sh

      - name: Shell in action.yml and the GitLab templates
        if: ${{ !cancelled() }}
        run: |
          go run ./internal/tools/extractshell -o "$RUNNER_TEMP/extracted" action.yml templates/fhirlint.yml .gitlab-ci.yml
          shellcheck "$RUNNER_TEMP"/extracted/*.sh

  # golangci-lint's unused only sees unexported code. deadcode follows the
  # calls from every main package and reports exported functions nothing
  # reaches, such as a wrapper only tests still call after a refactor (#547).
  # Intentional cases are in .github/deadcode-allow.txt with a reason; an entry
  # that is reachable again fails as stale. Built with the toolchain setup-go
  # installs, or it can't load the standard library.
  deadcode:
    name: Unreachable functions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go install golang.org/x/tools/cmd/deadcode@v0.52.0

      - name: Unreachable functions
        run: |
          deadcode -f '{{range .Funcs}}{{$.Path}}.{{.Name}}{{"\n"}}{{end}}' ./... | sort -u > "$RUNNER_TEMP/dead.txt"
          sed 's/#.*//; s/[[:space:]]*$//; /^$/d' .github/deadcode-allow.txt | sort -u > "$RUNNER_TEMP/allow.txt"
          unexpected=$(comm -23 "$RUNNER_TEMP/dead.txt" "$RUNNER_TEMP/allow.txt")
          stale=$(comm -13 "$RUNNER_TEMP/dead.txt" "$RUNNER_TEMP/allow.txt")
          if [ -n "$unexpected" ]; then
            echo "::error::unreachable from main: remove them, or call them from production code; only list one in .github/deadcode-allow.txt with a reason"
            echo "$unexpected"
          fi
          if [ -n "$stale" ]; then
            echo "::error::listed in .github/deadcode-allow.txt but reachable or gone: remove the entry"
            echo "$stale"
          fi
          [ -z "$unexpected" ] && [ -z "$stale" ]
