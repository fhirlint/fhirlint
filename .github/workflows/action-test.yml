name: Action self-test

on:
  push:
    branches: [main]
    paths: ['action.yml', '.github/workflows/action-test.yml']
  pull_request:
    paths: ['action.yml', '.github/workflows/action-test.yml']

permissions:
  contents: read

jobs:
  run-action:
    name: Composite action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Exercise the action end to end: it installs the latest release and runs
      # validate. fail-on never keeps the smoke test green regardless of the
      # fixtures' validity — we are testing the action wrapper, not the rules.
      - name: Run fhirlint action
        uses: ./
        with:
          path: testdata/
          fail-on: never
