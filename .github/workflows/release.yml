name: Release

on:
  push:
    tags:
      - 'v*'

# Granted per job below: the gate only needs to read workflow runs, and must not
# inherit the publishing job's write and signing scopes.
permissions: {}

jobs:
  # A tag push does not itself run the test/lint/security workflows, so this
  # checks the runs from when the commit landed on main. Nothing is published
  # unless they were green.
  require-green-ci:
    uses: ./.github/workflows/require-green-ci.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  release:
    name: GoReleaser
    needs: require-green-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # keyless signing of the provenance via Sigstore
      attestations: write # write attestations to the GitHub attestations API
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      # GoReleaser's `sboms` block shells out to syft, so it has to be on PATH
      # before the release runs.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to the fhirlint/homebrew-tap repo so GoReleaser can
          # publish the updated Homebrew cask on each release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
