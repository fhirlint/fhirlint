name: Release

on:
  push:
    tags:
      - 'v*'

# Granted per job below: the gate only needs to read workflow runs, and must not
# inherit the publishing job's write and signing scopes.
permissions: {}

jobs:
  # A tag push does not itself run the test/lint/security workflows, so this
  # checks the runs from when the commit landed on main. Nothing is published
  # unless they were green.
  require-green-ci:
    uses: ./.github/workflows/require-green-ci.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  release:
    name: GoReleaser
    needs: require-green-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # keyless signing of the provenance via Sigstore
      attestations: write # write attestations to the GitHub attestations API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module cache integrity
        run: go mod verify

      # GoReleaser's `sboms` block shells out to syft, so it has to be on PATH
      # before the release runs.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to the fhirlint/homebrew-tap repo so GoReleaser can
          # publish the updated Homebrew cask on each release.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.sbom.json
