name: Release

on:
  push:
    tags:
      - 'v*'

# Granted per job below: the gate only needs to read workflow runs, and must not
# inherit the publishing job's write and signing scopes.
permissions: {}

env:
  # Exact, not a range: the smoke-tested build and the published one must come
  # from the same GoReleaser to be the same bytes (#549). Same pin as
  # reproducible-build.yml.
  GORELEASER_VERSION: v2.20.2

jobs:
  # A tag push does not itself run the test/lint/security workflows, so this
  # checks the runs from when the commit landed on main. Nothing is published
  # unless they were green.
  require-green-ci:
    uses: $/.github/workflows/require-green-ci.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  # Builds the archives exactly as the release job will (reproducible, #549)
  # and smoke-tests each on its platform. Nothing is published unless that
  # passes.
  smoke-build:
    name: Build the archives for the smoke test
    needs: require-green-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20 # one GoReleaser build without SBOMs, as rebuild in reproducible-build.yml (max 127s for two)
    permissions:
      contents: read
    # The release build gets the pin from here: a reusable workflow's inputs
    # can't read env, and both builds must use the same GoReleaser.
    outputs:
      goreleaser-version: ${{ env.GORELEASER_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --skip=publish,sbom
        env:
          # The cask template needs it set; nothing is published here.
          HOMEBREW_TAP_GITHUB_TOKEN: unused

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: smoke-build
    uses: $/.github/workflows/smoke-archives.yml
    with:
      artifact: release-archives
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  # The build runs in a reusable workflow so that it, not this file, signs
  # the provenance: SLSA Build Level 3 (#601).
  release:
    needs: [require-green-ci, smoke-build, smoke]
    uses: $/.github/workflows/build-release.yml
    with:
      goreleaser-version: ${{ needs.smoke-build.outputs.goreleaser-version }}
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
      attestations: write
